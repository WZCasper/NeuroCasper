name = "neurocasper"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "neurocasper-db"
database_id = "0c84ead8-43bd-4626-a834-87b930642c25"

# Runs the YouTube/TikTok checker (src/scheduled.ts) on Cloudflare's own
# infrastructure. Replaced a GitHub Actions cron doing the same job:
# GitHub's scheduled-workflow timing isn't precise enough for a 5-minute
# interval (documented, known limitation, not something this project could
# fix) -- delays up to an hour were observed. Cron Triggers run on the same
# platform as the Worker and keep much tighter to schedule.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (BOT_TOKEN, WEBHOOK_SECRET, and optionally YOUTUBE_API_KEY) are
# set on this Worker directly in the Cloudflare dashboard -> Settings ->
# Variables and Secrets, or synced automatically on every push by
# .github/workflows/0-sync-secrets.yml. Never put an actual secret value in
# this file.
