name = "neurocasper"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "neurocasper-db"
database_id = "0c84ead8-43bd-4626-a834-87b930642c25"

# Secrets (BOT_TOKEN, WEBHOOK_SECRET) are set on this Worker directly in the
# Cloudflare dashboard -> Settings -> Variables and Secrets, since deploys
# run through Cloudflare's own Git integration rather than a custom GitHub
# Actions workflow. Never put an actual secret value in this file.
