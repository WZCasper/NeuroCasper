# Run once, manually (Actions tab -> this workflow -> "Run workflow"), to
# apply migrations/010_add_url_blacklist.sql to the live D1 database --
# adds the two columns that back the URL blacklist (/settings -> chat ->
# «👥 Модерация группы»): a per-chat on/off toggle and a blacklist of
# specific channel/page links.
#
# Safe to re-run: see 7-migrate-leave-message.yml's own comment -- this
# workflow checks first via PRAGMA table_info(channels) and skips the
# ALTER TABLE statements if url_blacklist_enabled is already there.
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets
# (same ones the other migration workflows already use).
name: "10) Add URL blacklist columns to D1"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the migration is already applied
        id: check
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --json --command "PRAGMA table_info(channels)"

      - name: Decide whether to apply it
        id: decide
        env:
          # command-output is wrangler-action's own documented output
          # variable (since v3.4.0) holding the previous step's stdout as a
          # string -- not a file path. Routed through env here (rather than
          # interpolated directly into the script) so the JSON content is
          # never substituted into shell syntax.
          CHECK_OUTPUT: ${{ steps.check.outputs.command-output }}
        run: |
          HAS_COLUMN=$(echo "$CHECK_OUTPUT" | jq -r '.[0].results[] | select(.name == "url_blacklist_enabled") | .name')
          if [ -n "$HAS_COLUMN" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already applied -- nothing to do
        if: steps.decide.outputs.already_applied == 'true'
        run: echo "url_blacklist_enabled already exists on channels -- migration 010 was already applied, skipping."

      - name: Apply migrations/010_add_url_blacklist.sql
        if: steps.decide.outputs.already_applied == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --file=./migrations/010_add_url_blacklist.sql

      - name: Confirm the two new columns are there
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --command "PRAGMA table_info(channels)"
