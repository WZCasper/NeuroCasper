# Runs on every push (same trigger as Cloudflare's own Git-integration
# deploy) and manually. Exists because dashboard-added Worker secrets don't
# reliably survive the automatic redeploys Cloudflare's Git integration
# triggers on every push -- confirmed by BOT_TOKEN/WEBHOOK_SECRET showing up
# in the version history as added, then the Settings -> Variables and
# Secrets page showing empty a few deploys later. Setting secrets via
# wrangler instead attaches them to the Worker itself rather than one
# version, and re-running this after every push keeps them from silently
# disappearing again.
#
# YOUTUBE_API_KEY is optional and NOT synced here on purpose: wrangler-action
# fails outright if a listed secret has no matching GitHub secret at all
# (not just empty), so listing it unconditionally breaks this workflow for
# anyone who hasn't set one. If you get a YouTube Data API key later, add it
# as a repo secret (Settings -> Secrets and variables -> Actions) named
# YOUTUBE_API_KEY, then add these two lines back:
#   to `secrets:` below:  YOUTUBE_API_KEY
#   to `env:` below:      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
name: "0) Sync Worker secrets"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Set BOT_TOKEN and WEBHOOK_SECRET on the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
          command: secret list
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
