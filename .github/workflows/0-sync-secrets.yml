# Runs on every push (same trigger as Cloudflare's own Git-integration
# deploy) and manually. Exists because dashboard-added Worker secrets don't
# reliably survive the automatic redeploys Cloudflare's Git integration
# triggers on every push -- confirmed by BOT_TOKEN/WEBHOOK_SECRET showing up
# in the version history as added, then the Settings -> Variables and
# Secrets page showing empty a few deploys later. Setting secrets via
# wrangler instead attaches them to the Worker itself rather than one
# version, and re-running this after every push keeps them from silently
# disappearing again.
#
# YOUTUBE_API_KEY is optional and NOT synced here on purpose: wrangler-action
# fails outright if a listed secret has no matching GitHub secret at all
# (not just empty), so listing it unconditionally breaks this workflow for
# anyone who hasn't set one. If you get a YouTube Data API key later, add it
# as a repo secret (Settings -> Secrets and variables -> Actions) named
# YOUTUBE_API_KEY, then add these two lines back:
#   to `secrets:` below:  YOUTUBE_API_KEY
#   to `env:` below:      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
#
# KICK_CLIENT_ID / KICK_CLIENT_SECRET ARE listed unconditionally below,
# unlike YOUTUBE_API_KEY -- Kick support isn't optional the way the YouTube
# Data API key is (see src/lib/kick.ts): the streamer OAuth flow needs
# these to work at all. If Kick isn't in use yet, either set both repo
# secrets to placeholder values or remove these two lines from `secrets:`
# and `env:` below until ready to use it.
name: "0) Sync Worker secrets"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # The `secrets:` input is what actually sets them: wrangler-action runs
      # `wrangler secret bulk` for the names listed here BEFORE running
      # `command:` below, resolving the target Worker from wrangler.toml's
      # `name`. Previously this step's `command` was `secret list`, which
      # only *reads* secrets back -- it never sets anything, and naming the
      # step "Set BOT_TOKEN and WEBHOOK_SECRET" while running a read-only
      # command was misleading about what each part of this step does.
      #
      # `command` is set to a harmless `whoami` on purpose: wrangler-action
      # defaults to `wrangler deploy` when `command` is omitted, which would
      # needlessly re-deploy the Worker on every push -- deployment is
      # already handled by Cloudflare's own Git integration (see README).
      - name: Set BOT_TOKEN, WEBHOOK_SECRET and Kick secrets on the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            KICK_CLIENT_ID
            KICK_CLIENT_SECRET
          command: whoami
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}

      # Separate, explicit confirmation step: lists secret NAMES only (the
      # Cloudflare API never returns values) so you can see in the run log
      # that both secrets are actually attached to the Worker.
      - name: Confirm secrets are set (names only, values are never shown)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret list
