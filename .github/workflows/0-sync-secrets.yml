# Runs on every push (same trigger as Cloudflare's own Git-integration
# deploy) and manually. Exists because dashboard-added Worker secrets don't
# reliably survive the automatic redeploys Cloudflare's Git integration
# triggers on every push -- confirmed by BOT_TOKEN/WEBHOOK_SECRET showing up
# in the version history as added, then the Settings -> Variables and
# Secrets page showing empty a few deploys later, which lines up exactly
# with the bot's webhook throwing 500s (grammY rejects an empty BOT_TOKEN
# when constructing Bot). Setting secrets via wrangler instead (this
# workflow) attaches them to the Worker itself rather than one version, and
# re-running this after every push keeps them from silently disappearing
# again, whatever the exact mechanism behind that turns out to be.
name: "0) Sync Worker secrets"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Set BOT_TOKEN and WEBHOOK_SECRET on the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
          command: whoami
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
