# Run this manually, after the first successful deploy. Points Telegram at
# the deployed webhook. Re-run any time you rotate WEBHOOK_SECRET or change
# the Worker's URL below.
name: "2) Set Telegram webhook"

on:
  workflow_dispatch: {}

env:
  # Update this if the Worker's URL ever changes (custom domain, renamed
  # Worker, different workers.dev subdomain, etc). Not read from
  # wrangler.toml on purpose: nothing in the Worker's own code needs this
  # value anymore (Twitch removal took the only user of it with it), so
  # keeping it here avoids carrying an otherwise-unused variable in
  # wrangler.toml just for this one workflow's sake.
  WORKER_URL: "https://neurocasper.webtkachdenis.workers.dev"

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Call Telegram setWebhook
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}/webhook/telegram" \
            --data-urlencode "secret_token=${{ secrets.WEBHOOK_SECRET }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || (echo "::error::setWebhook call failed, see response above" && exit 1)

      - name: Show current webhook status (delivery errors show up here)
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo" | python3 -m json.tool
