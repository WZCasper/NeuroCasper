# Run once, manually (Actions tab -> this workflow -> "Run workflow"), to
# apply migrations/011_add_hide_service_messages.sql to the live D1
# database -- adds the per-chat toggle to delete Telegram's OWN "X
# joined/left the group" service message (/settings -> chat -> «👥
# Модерация группы»), independent of the bot's own welcome/leave text.
#
# Safe to re-run: see 10-migrate-url-blacklist.yml's own comment -- this
# workflow checks first via PRAGMA table_info(channels) and skips the
# ALTER TABLE statement if hide_service_messages is already there.
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets
# (same ones the other migration workflows already use).
name: "11) Add hide_service_messages column to D1"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the migration is already applied
        id: check
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --json --command "PRAGMA table_info(channels)"

      - name: Decide whether to apply it
        id: decide
        env:
          # command-output is wrangler-action's own documented output
          # variable (since v3.4.0) holding the previous step's stdout as a
          # string -- not a file path. Routed through env here (rather than
          # interpolated directly into the script) so the JSON content is
          # never substituted into shell syntax.
          CHECK_OUTPUT: ${{ steps.check.outputs.command-output }}
        run: |
          HAS_COLUMN=$(echo "$CHECK_OUTPUT" | jq -r '.[0].results[] | select(.name == "hide_service_messages") | .name')
          if [ -n "$HAS_COLUMN" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already applied -- nothing to do
        if: steps.decide.outputs.already_applied == 'true'
        run: echo "hide_service_messages already exists on channels -- migration 011 was already applied, skipping."

      - name: Apply migrations/011_add_hide_service_messages.sql
        if: steps.decide.outputs.already_applied == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --file=./migrations/011_add_hide_service_messages.sql

      - name: Confirm the new column is there
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --command "PRAGMA table_info(channels)"
