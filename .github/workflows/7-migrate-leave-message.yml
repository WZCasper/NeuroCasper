# Run once, manually (Actions tab -> this workflow -> "Run workflow"), to
# apply migrations/008_add_leave_message.sql to the live D1 database --
# adds the two columns that back the per-chat "member left the group"
# announcement (/settings -> chat -> «👥 Модерация группы»).
#
# Safe to re-run: this migration is two ALTER TABLE ... ADD COLUMN
# statements, and SQLite has no ADD COLUMN IF NOT EXISTS (see
# 6-migrate-moderation-settings.yml's own comment on this, which this
# workflow copies the same check-first approach from). So this workflow
# checks first, itself, via PRAGMA table_info(channels): if leave_enabled
# is already there, it skips straight to a plain "already applied" message
# instead of running the ALTER TABLE statements a second time and failing
# on "duplicate column name".
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets
# (same ones the other migration workflows already use).
name: "7) Add leave-message columns to D1"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the migration is already applied
        id: check
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --json --command "PRAGMA table_info(channels)"

      - name: Decide whether to apply it
        id: decide
        env:
          # command-output is wrangler-action's own documented output
          # variable (since v3.4.0) holding the previous step's stdout as a
          # string -- not a file path. Routed through env here (rather than
          # interpolated directly into the script) so the JSON content is
          # never substituted into shell syntax.
          CHECK_OUTPUT: ${{ steps.check.outputs.command-output }}
        run: |
          HAS_COLUMN=$(echo "$CHECK_OUTPUT" | jq -r '.[0].results[] | select(.name == "leave_enabled") | .name')
          if [ -n "$HAS_COLUMN" ]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already applied -- nothing to do
        if: steps.decide.outputs.already_applied == 'true'
        run: echo "leave_enabled already exists on channels -- migration 008 was already applied, skipping."

      - name: Apply migrations/008_add_leave_message.sql
        if: steps.decide.outputs.already_applied == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --file=./migrations/008_add_leave_message.sql

      - name: Confirm the two new columns are there
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --command "PRAGMA table_info(channels)"
