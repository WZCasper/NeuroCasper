# Run this manually (Actions tab -> this workflow -> "Run workflow"):
#   - the first time, to create the D1 database and apply schema.sql
#   - any time schema.sql changes, to re-apply it (it's a full drop+recreate,
#     safe to re-run -- see the comment at the top of schema.sql)
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets.
# First run only: copy the printed database_id into wrangler.toml's
# database_id (replacing the placeholder), commit and push -- Cloudflare's
# Git integration redeploys the Worker automatically from there.
name: "1) Bootstrap/migrate D1 database"

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create D1 database (no-op if it already exists)
        id: create
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 create neurocasper-db

      - name: Note if it already existed
        if: steps.create.outcome == 'failure'
        run: echo "Database probably already exists -- that's fine, continuing to apply schema.sql against it."

      - name: Apply schema.sql
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neurocasper-db --remote --file=./schema.sql
